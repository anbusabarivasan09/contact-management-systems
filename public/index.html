<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Contact Management System</h1>
            <p>Manage your personal and professional contacts</p>
        </header>

        <section class="dashboard-card">
            <div class="stat-card">
                <h3>Total Contacts</h3>
                <div id="totalContacts">0</div>
            </div>
        </section>

        <section class="form-card">
            <h2>Add New Contact</h2>

            <form id="contactForm">

                <input type="hidden" id="editId">

                <div class="form-grid">

                    <div>
                        <label>Contact ID</label>
                        <input type="text" id="contactId" placeholder="C001" required>
                    </div>

                    <div>
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Enter name" required>
                    </div>

                    <div>
                        <label>Phone</label>
                        <input type="text" id="phone" placeholder="10 digit phone number" maxlength="10" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">Add Contact</button>
                    <button type="button" id="cancelBtn" class="cancel-btn" onclick="cancelEdit()">Cancel</button>
                </div>

            </form>

            <p id="message"></p>
        </section>

        <section class="contacts-card">

            <div class="contacts-header">
                <h2>My Contacts</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search contacts..."
                    onkeyup="searchContacts()"
                >
            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Contact ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="contactsTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
